<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My AI Chat</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--text:#e8e9ed;--acc:#7c9cff;--user:#243055;--bot:#1d2129}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;padding:10px;background:var(--panel);align-items:center}
select,button,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid #2c313d;border-radius:10px;padding:8px}
select{flex:1;min-width:0}
button{background:var(--acc);color:#0b1020;border:0;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid #2c313d}
#sys{display:none;margin:8px 10px 0;width:calc(100% - 20px);height:90px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user)}
.a{align-self:flex-start;background:var(--bot)}
form{display:flex;gap:8px;padding:10px;background:var(--panel)}
textarea{flex:1;resize:none;height:46px}
</style>
</head>
<body>
<header>
  <select id="model"></select>
  <button class="ghost" id="sysBtn" type="button">System</button>
  <button class="ghost" id="clr" type="button">New</button>
</header>
<textarea id="sys" placeholder="System prompt">You are a direct, helpful assistant. Answer fully and honestly without unnecessary disclaimers.</textarea>
<div id="chat"></div>
<form id="f">
  <textarea id="in" placeholder="Message..." rows="1"></textarea>
  <button>Send</button>
</form>
<script>
const $=id=>document.getElementById(id);
const chat=$("chat"),input=$("in"),sys=$("sys");
let history=[];
const code=()=>localStorage.getItem("code")||"";
const hdr=()=>({"Content-Type":"application/json","x-access-code":code()});
function add(role,text){
  const d=document.createElement("div");
  d.className="m "+(role==="user"?"u":"a");
  d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
async function loadModels(){
  let r=await fetch("/api/models",{headers:hdr()});
  if(r.status===401){
    const c=prompt("Access code:");localStorage.setItem("code",c||"");
    r=await fetch("/api/models",{headers:hdr()});
  }
  const list=await r.json();
  $("model").innerHTML=(Array.isArray(list)?list:[]).map(m=>`<option>${m}</option>`).join("");
  const saved=localStorage.getItem("model");if(saved)$("model").value=saved;
}
$("model").onchange=e=>localStorage.setItem("model",e.target.value);
$("sysBtn").onclick=()=>{sys.style.display=sys.style.display==="block"?"none":"block"};
$("clr").onclick=()=>{history=[];chat.innerHTML=""};
$("f").onsubmit=async e=>{
  e.preventDefault();
  const text=input.value.trim();if(!text)return;
  input.value="";add("user",text);history.push({role:"user",content:text});
  const bubble=add("assistant","...");let full="";
  const messages=[{role:"system",content:sys.value},...history];
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:hdr(),body:JSON.stringify({model:$("model").value,messages})});
    if(!r.ok){const j=await r.json().catch(()=>({}));bubble.textContent="Error: "+(j.error||r.status);return}
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const l of lines){
        if(!l.trim())continue;
        try{const j=JSON.parse(l);if(j.message&&j.message.content){full+=j.message.content;bubble.textContent=full;chat.scrollTop=chat.scrollHeight}}catch{}
      }
    }
    history.push({role:"assistant",content:full});
  }catch(err){bubble.textContent="Error: "+err}
};
loadModels();
</script>
</body>
</html>
